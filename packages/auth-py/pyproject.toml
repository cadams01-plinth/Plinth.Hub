[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plinth-auth"
version = "0.1.0"
description = "Verify Plinth Launch Tokens (PLT) in Python suite apps — offline JWKS verification with replay protection. SPEC §3."
requires-python = ">=3.10"
dependencies = [
  "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["plinth_auth"]
